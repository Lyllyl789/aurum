name: Aurum CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out sources
        uses: actions/checkout@v4
      - name: Install verified MoonBit toolchain
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- '0.10.15+943464bfa'
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Show toolchain
        run: moon version --all
      - name: Check formatting
        run: moon fmt --check
      - name: Check
        run: moon check
      - name: Build
        run: moon build
      - name: Test
        run: moon test
      - name: Run CLI demo
        run: moon run bin
      - name: Run use case scenarios
        run: moon run examples/use-cases
      - name: Run README example
        run: moon run examples/readme
